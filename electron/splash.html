<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>From Islam to Christ</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #10212d;
        color: #f7f2e8;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #1d3d4a 0%, #10212d 62%);
      }

      main {
        display: grid;
        justify-items: center;
        gap: 16px;
        width: 100%;
        padding: 34px;
        text-align: center;
      }

      img {
        display: block;
        width: 330px;
        height: 330px;
        object-fit: contain;
        filter: drop-shadow(0 16px 28px rgba(0, 0, 0, .35));
      }

      p {
        margin: 0;
        color: #c9d6d7;
        font-size: 13px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../logo/logo.png" alt="From Islam to Christ" />
      <p>Preparing your private library</p>
    </main>
  </body>
</html>
