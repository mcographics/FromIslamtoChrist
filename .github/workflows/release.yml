name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Build Android test APK
        run: npm run android:debug

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ github.ref_name }}"
          $releaseVersion = $releaseTag.TrimStart('v')
          $androidAsset = "release/From-Islam-to-Christ-$releaseVersion.apk"
          Copy-Item -LiteralPath 'android/app/build/outputs/apk/debug/app-debug.apk' -Destination $androidAsset
          $assets = @($androidAsset)
          $assets += (Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in @('.exe', '.yml', '.blockmap') } | ForEach-Object { $_.FullName })
          $releaseNotes = @"
          # From Islam to Christ $releaseTag

          - Version: $releaseVersion
          - Release tag: $releaseTag
          - Release channel: Stable
          - Platforms: Windows and Android

          This release is distributed from the tagged build above. Review the included assets and the commit history for the complete change set.

          **Full Changelog**: https://github.com/mcographics/FromIslamtoChrist/commits/$releaseTag
          "@
          gh release create $releaseTag $assets --title "From Islam to Christ $releaseTag" --notes $releaseNotes
